name: UI simulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    name: UI simulator (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [viewe15, viewe21]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/ui_sim/requirements.txt
      - name: Install native and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev
          python -m pip install -r test/ui_sim/requirements.txt
      - name: Check dependency pins and failure reporting
        run: python test/ui_sim/tooling.py
      - name: Build public harness and run UI checks
        run: test/ui_sim/run-all.sh "${{ matrix.board }}"
