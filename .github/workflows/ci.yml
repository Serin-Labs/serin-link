name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: viewe15
            defaults: "sdkconfig.defaults;sdkconfig.defaults.viewe"
          - board: viewe21
            defaults: "sdkconfig.defaults;sdkconfig.defaults.viewe21"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # -DSDKCONFIG must be pinned into the build dir: without it IDF would
      # reuse a root ./sdkconfig and silently ignore the defaults chain.
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: >
            python -m pip install -r tools/requirements-build.txt &&
            idf.py -B build_${{ matrix.board }}
            -DSDKCONFIG=build_${{ matrix.board }}/sdkconfig
            -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}"
            build &&
            git diff --exit-code -- dependencies.lock

  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pinned so a validator change lands here as a deliberate bump. This
      # commit must be on serin-cn105's main (fast-forward, not squashed).
      - name: Checkout distribution validation tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Serin-Labs/serin-cn105
          ref: a0ea365e9e1713482fc6d8be8848db42fc4b0c44
          path: validation-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-release.txt
      - run: python -m pip install -r tools/requirements-release.txt
      - run: test/run-all.sh
        env:
          SERIN_DISTRIBUTION_ROOT: ${{ github.workspace }}/validation-tools
